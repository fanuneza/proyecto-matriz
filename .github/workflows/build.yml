name: Build & Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build static export
        env:
          CNE_API_EMAIL: ${{ secrets.CNE_API_EMAIL }}
          CNE_API_PASSWORD: ${{ secrets.CNE_API_PASSWORD }}
        run: npm run build

      - name: Validate output artifacts
        run: npm run check-output

      - name: Validate static routes
        run: npm run check-routes

      - name: Validate SEO output
        run: npm run check-seo
